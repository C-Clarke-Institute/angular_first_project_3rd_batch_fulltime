<span>Display product list in here</span>
<div style="display: flex">
  <div>
    @for ( product of products; track product.id ) {
      <p> {{ $index + 1}} </p>
      <p> {{ $first }} </p>
      <p> {{ $last }} </p>
      <p> {{ $odd }} </p>
      <p> {{ $even }} </p>
      <p> {{ $count }} </p>
      <app-product [product]="product" (onAddToCart)="onAddToCartProduct($event)"  ></app-product>
    }
  </div>
  <div style="margin-left: 200px">
    @for ( product of cartProducts; track product.id ) {
      <p> {{ product.name }}</p>
    }
  </div>
</div>
